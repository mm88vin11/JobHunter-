<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JobHunter · hh.ru</title><meta name="robots" content="noindex">
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:520px;margin:12vh auto;padding:16px;background:#f6f7fb;color:#14161f}@media (prefers-color-scheme:dark){body{background:#0e1016;color:#e8eaf2}}a.b{display:inline-block;background:#4f46e5;color:#fff;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:600}code{word-break:break-all;background:rgba(127,127,127,.15);padding:2px 6px;border-radius:6px}</style></head>
<body><h1>🎯 Подключение hh.ru</h1><div id="o">Нет кода авторизации.</div>
<script>
const code=new URLSearchParams(location.search).get('code');
if(code){
 const bot=localStorage.getItem('jh_bot')||'DreamJobAgent';
 const short=/^[A-Za-z0-9_-]{1,61}$/.test(code);
 document.getElementById('o').innerHTML='<p>Осталось одно касание: передать код боту.</p>'+(short?'<p><a class="b" href="https://t.me/'+bot+'?start=hh-'+code+'">Передать код боту</a></p>':'')+'<p>Или отправьте боту сообщение:<br><code>/hh '+code.replace(/</g,'')+'</code></p>';}
</script></body></html>
