name: JobHunter engine (сбор вакансий)

on:
  schedule:
    # каждые 2 часа (бесплатные 2000 минут/мес для приватного репозитория);
    # для публичного репозитория можно ставить "*/30 * * * *"
    - cron: "7 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: jobhunter-engine
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      - name: Сбор → антискам → ранжирование → отправка в Worker
        working-directory: engine
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: python -m jobhunter_engine.run
